# Runpod — Tiel-Coder-35B-A3B UD-Q4_K_XL 22.4GB (eniewold serverless + greyul pod)
serverless:
  name: tiel-coder-q4xl
  type: QUEUE
  image: cpalau/tiel-runpod:eniewold
  gpu_pools: [AMPERE_80, BLACKWELL_96, ADA_80_PRO]
  workers_min: 0
  workers_max: 2
  idle_timeout: 5
  scaler_type: QUEUE_DELAY
  scaler_value: 2
  container_disk: 60
  network_volume: l1lelwqilk
  flashboot: FLASHBOOT
  timeout: 600000
  env:
    LLAMA_ARG_HF_REPO: peculiar-ragdoll/Tiel-Coder-35B-A3B-GGUF
    LLAMA_HF_QUANT: UD-Q4_K_XL
    LLAMA_ARG_CTX_SIZE: "262144"
    LLAMA_ARG_N_PARALLEL: "1"
    LLAMA_ARG_N_GPU_LAYERS: "999"
    LLAMA_ARG_N_CPU_MOE: "0"
    LLAMA_ARG_FLASH_ATTN: auto
pod:
  name: tiel-coder-pod
  image: greyul/runpod-llama-cpp-cuda:latest
  gpu: { id: NVIDIA A100-SXM4-80GB, count: 1 }
  disk: 60
  ports: ["8080/http", "22/tcp"]
  env:
    HF_REPO: peculiar-ragdoll/Tiel-Coder-35B-A3B-GGUF
    HF_FILE: Tiel-Coder-35B-A3B-UD-Q4_K_XL.gguf
    MODELS_DIR: /workspace/models
    LLAMA_ARGS: "--host 0.0.0.0 --port 8080 --ctx-size 262144 -ngl 99 --jinja"
